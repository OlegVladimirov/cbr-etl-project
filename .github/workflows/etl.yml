name: Ежедневный ETL с ЦБ РФ

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC ~ 05:00 МСК
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачать код
      - name: Checkout код
        uses: actions/checkout@v4

      # 2. Установить Python
      - name: Установить Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Установить зависимости
      - name: Установить зависимости
        run: |
          pip install --upgrade pip
          pip install -r etl/requirements.txt

      # 4.
      - name: 🌐 Показать IP-адрес runner'а
        run: |
          echo "Public IP: $(curl -s ifconfig.me)"
          echo "GitHub Actions runner IP shown."

      # 5. Запустить ETL-скрипт
      - name: Запустить ETL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INIT_LOAD: ${{ secrets.INIT_LOAD }}  # опционально
        run: |
          python etl/etl_cbr_exchange_rates.py

      # 6. Продлить срок жизни БД
      - name: 🔁 Продлить срок жизни БД на freesqldatabase.com
        run: |
          echo "Выполняем продление аккаунта..."
          curl -fsS --max-time 30 "https://www.freesqldatabase.com/extension/?acc=O2PJNu1dZzXVMO3I6gtaqw%3D%3D"
          if [ $? -eq 0 ]; then
            echo "✅ Успешно продлено"
          else
            echo "❌ Ошибка при продлении"
          fi
